<!DOCTYPE html>
<html lang="ru" data-theme="dark" data-color="red">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Платформа (by StreamLiveTV)</title>
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0f0f;
            --text-color: #ffffff;
            --text-secondary: #aaa;
            --hover-color: #272727;
            --accent-color: #ff0000;
            --header-bg: rgba(15, 15, 15, 0.95);
            --sidebar-width: 240px;
        }

        [data-theme="light"] {
            --bg-color: #ffffff;
            --text-color: #0f0f0f;
            --text-secondary: #606060;
            --hover-color: #f2f2f2;
            --header-bg: rgba(255, 255, 255, 0.95);
        }

        [data-color="blue"] { --accent-color: #3ea6ff; }
        [data-color="green"] { --accent-color: #2ba640; }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }

        body { background-color: var(--bg-color); color: var(--text-color); overflow-x: hidden; }

        /* Header */
        header {
            position: fixed; top: 0; left: 0; right: 0; height: 56px;
            background: var(--header-bg); display: flex; align-items: center;
            justify-content: space-between; padding: 0 16px; z-index: 1000;
        }

        .header-left { display: flex; align-items: center; gap: 16px; }
        .logo { font-weight: bold; font-size: 18px; cursor: pointer; display: flex; align-items: center; gap: 4px; }
        .logo span { color: var(--accent-color); font-size: 12px; font-weight: normal; }

        .search-container { flex: 0 1 720px; display: flex; align-items: center; }
        .search-bar {
            width: 100%; display: flex; background: #121212;
            border: 1px solid #333; border-radius: 40px 0 0 40px; padding: 0 16px;
        }
        [data-theme="light"] .search-bar { background: #fff; border: 1px solid #ccc; }
        .search-bar input {
            width: 100%; height: 40px; background: transparent; border: none;
            color: var(--text-color); outline: none; font-size: 16px;
        }
        .search-btn {
            background: #222; border: 1px solid #333; border-left: none;
            padding: 0 20px; height: 40px; border-radius: 0 40px 40px 0; cursor: pointer;
        }
        [data-theme="light"] .search-btn { background: #f8f8f8; border: 1px solid #ccc; }

        /* Sidebar */
        aside {
            position: fixed; top: 56px; left: 0; width: var(--sidebar-width);
            height: calc(100vh - 56px); padding: 12px; overflow-y: auto;
        }
        .nav-item {
            display: flex; align-items: center; gap: 24px; padding: 10px 12px;
            border-radius: 10px; cursor: pointer; transition: 0.2s; text-decoration: none; color: inherit;
        }
        .nav-item:hover, .nav-item.active { background: var(--hover-color); }
        .nav-item i { font-size: 24px; }

        /* Content Area */
        main { margin-top: 56px; margin-left: var(--sidebar-width); padding: 24px; min-height: 100vh; }

        /* Grid */
        .video-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px; row-gap: 40px;
        }

        .video-card { cursor: pointer; }
        .thumbnail {
            width: 100%; aspect-ratio: 16/9; border-radius: 12px;
            background: #333; overflow: hidden; position: relative;
        }
        .thumbnail img { width: 100%; height: 100%; object-fit: cover; }
        .video-info { display: flex; gap: 12px; margin-top: 12px; }
        .channel-icon { width: 36px; height: 36px; border-radius: 50%; background: #444; flex-shrink: 0; }
        .details h3 { font-size: 16px; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .details p { color: var(--text-secondary); font-size: 14px; }

        /* Watch Page */
        .watch-container { display: grid; grid-template-columns: 1fr 400px; gap: 24px; }
        .player-box { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; }
        .player-box iframe { width: 100%; height: 100%; border: none; }
        .video-meta { margin-top: 16px; }
        .side-recs { display: flex; flex-direction: column; gap: 12px; }
        .rec-card { display: flex; gap: 8px; cursor: pointer; }
        .rec-thumb { width: 168px; aspect-ratio: 16/9; border-radius: 8px; flex-shrink: 0; background: #333; }
        .rec-details h4 { font-size: 14px; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* Settings Modal */
        #settings-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: var(--bg-color); border: 1px solid #333; padding: 24px;
            border-radius: 12px; z-index: 2000; display: none; min-width: 300px;
        }
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1050; display: none;
        }

        /* Mobile */
        .mobile-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 50px;
            background: var(--bg-color); border-top: 1px solid #333;
            display: none; justify-content: space-around; align-items: center; z-index: 1000;
        }

        @media (max-width: 1000px) {
            .watch-container { grid-template-columns: 1fr; }
            aside { display: none; }
            main { margin-left: 0; }
            .mobile-nav { display: flex; }
            .search-container { flex: 1; margin: 0 10px; }
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <div class="logo" onclick="app.navigate('home')">Платформа <span>by StreamLiveTV</span></div>
    </div>
    <div class="search-container">
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Введите запрос">
        </div>
        <button class="search-btn" onclick="app.search()"><i class="material-icons-outlined">search</i></button>
    </div>
    <div class="header-right">
        <button class="nav-item" onclick="app.toggleSettings()" style="padding: 8px;"><i class="material-icons-outlined">settings</i></button>
    </div>
</header>

<aside id="desktop-sidebar">
    <div class="nav-item active" onclick="app.navigate('home')"><i class="material-icons-outlined">home</i> Главная</div>
    <div class="nav-item"><i class="material-icons-outlined">explore</i> Тренды</div>
    <div class="nav-item"><i class="material-icons-outlined">subscriptions</i> Подписки</div>
    <hr style="margin: 12px 0; border: 0; border-top: 1px solid #333;">
    <div class="nav-item"><i class="material-icons-outlined">video_library</i> Библиотека</div>
</aside>

<main id="app-content">
    <!-- Content injected here -->
</main>

<nav class="mobile-nav">
    <div onclick="app.navigate('home')"><i class="material-icons-outlined">home</i></div>
    <div onclick="document.getElementById('search-input').focus()"><i class="material-icons-outlined">search</i></div>
    <div><i class="material-icons-outlined">subscriptions</i></div>
    <div onclick="app.toggleSettings()"><i class="material-icons-outlined">settings</i></div>
</nav>

<div class="modal-overlay" id="overlay" onclick="app.toggleSettings()"></div>
<div id="settings-modal">
    <h3>Настройки</h3>
    <div style="margin: 20px 0;">
        <p>Тема:</p>
        <button onclick="app.setTheme('dark')">Темная</button>
        <button onclick="app.setTheme('light')">Светлая</button>
    </div>
    <div style="margin: 20px 0;">
        <p>Цвет акцента:</p>
        <button onclick="app.setColor('red')">Красный</button>
        <button onclick="app.setColor('blue')">Синий</button>
        <button onclick="app.setColor('green')">Зеленый</button>
    </div>
    <button onclick="app.toggleSettings()">Закрыть</button>
</div>

<script>
/** 
 * RECOMMENDATION ALGORITHM 
 * Использует localStorage для хранения истории и весов каналов.
 */
const RecEngine = {
    historyKey: 'plt_history',
    statsKey: 'plt_stats',

    logView(videoId, channelId) {
        let history = JSON.parse(localStorage.getItem(this.historyKey) || '[]');
        if (!history.includes(videoId)) {
            history.push(videoId);
            if (history.length > 100) history.shift();
            localStorage.setItem(this.historyKey, JSON.stringify(history));
        }

        let stats = JSON.parse(localStorage.getItem(this.statsKey) || '{}');
        stats[channelId] = (stats[channelId] || 0) + 1;
        localStorage.setItem(this.statsKey, JSON.stringify(stats));
    },

    rankVideos(videos) {
        const stats = JSON.parse(localStorage.getItem(this.statsKey) || '{}');
        const history = JSON.parse(localStorage.getItem(this.historyKey) || '[]');

        return videos.map(v => {
            let score = 0;
            // Вес за популярность канала у пользователя
            if (stats[v.channel_id]) score += stats[v.channel_id] * 10;
            // Понижение если уже смотрел
            if (history.includes(v.id)) score -= 50;
            // Рандом для свежести
            score += Math.random() * 5;
            return { ...v, _score: score };
        }).sort((a, b) => b._score - a._score);
    }
};

/** 
 * MAIN APP LOGIC
 */
const app = {
    allVideos: [],
    filteredVideos: [],
    allowedChannels: ['oinktech', 'twixoff', 'ТВКАНАЛЫ'],
    apis: {
        channels: 'https://aqeleulwobgamdffkfri.supabase.co/functions/v1/public-channels',
        extra: 'https://embesslivestudio.vercel.app/'
    },

    async init() {
        this.loadSettings();
        await this.fetchData();
        this.navigate('home');
    },

    async fetchData() {
        try {
            const resp = await fetch(this.apis.channels);
            const data = await resp.json();
            
            // Фильтрация каналов
            this.allVideos = data.filter(v => 
                this.allowedChannels.includes(v.channel_id) || 
                this.allowedChannels.includes(v.channel_name)
            );
            this.filteredVideos = [...this.allVideos];
        } catch (e) {
            console.error("API Error", e);
        }
    },

    renderHome() {
        const ranked = RecEngine.rankVideos(this.filteredVideos);
        let html = `<div class="video-grid">`;
        ranked.forEach(v => {
            html += `
                <div class="video-card" onclick="app.viewVideo('${v.id}')">
                    <div class="thumbnail">
                        <img src="${v.thumbnail_url || 'https://via.placeholder.com/320x180?text=No+Preview'}" loading="lazy">
                    </div>
                    <div class="video-info">
                        <div class="channel-icon"></div>
                        <div class="details">
                            <h3>${v.title || 'Без названия'}</h3>
                            <p>${v.channel_id}</p>
                            <p>${v.views || 0} просмотров</p>
                        </div>
                    </div>
                </div>
            `;
        });
        html += `</div>`;
        document.getElementById('app-content').innerHTML = html;
    },

    viewVideo(id) {
        const video = this.allVideos.find(v => v.id == id);
        if (!video) return;

        RecEngine.logView(video.id, video.channel_id);
        
        const recommendations = RecEngine.rankVideos(
            this.allVideos.filter(v => v.id != id)
        ).slice(0, 10);

        let recHtml = '';
        recommendations.forEach(r => {
            recHtml += `
                <div class="rec-card" onclick="app.viewVideo('${r.id}')">
                    <div class="rec-thumb"><img src="${r.thumbnail_url}" style="width:100%;height:100%;object-fit:cover;border-radius:8px;"></div>
                    <div class="rec-details">
                        <h4>${r.title}</h4>
                        <p style="font-size:12px;color:var(--text-secondary);margin-top:4px;">${r.channel_id}</p>
                    </div>
                </div>
            `;
        });

        const html = `
            <div class="watch-container">
                <div class="main-video">
                    <div class="player-box">
                        <iframe src="https://embesslivestudio.lovable.app/?v=${video.id}" allowfullscreen></iframe>
                    </div>
                    <div class="video-meta">
                        <h2>${video.title}</h2>
                        <div style="display:flex;align-items:center;gap:12px;margin-top:12px;padding-bottom:12px;border-bottom:1px solid #333;">
                            <div class="channel-icon" onclick="app.viewChannel('${video.channel_id}')" style="cursor:pointer"></div>
                            <div>
                                <strong onclick="app.viewChannel('${video.channel_id}')" style="cursor:pointer">${video.channel_id}</strong>
                            </div>
                        </div>
                        <p style="margin-top:12px; font-size:14px;">${video.description || 'Описание отсутствует'}</p>
                    </div>
                </div>
                <div class="side-recs">
                    ${recHtml}
                </div>
            </div>
        `;
        document.getElementById('app-content').innerHTML = html;
        window.scrollTo(0,0);
    },

    viewChannel(channelId) {
        const channelVideos = this.allVideos.filter(v => v.channel_id === channelId);
        const html = `
            <div class="channel-header" style="margin-bottom:24px;">
                <div style="height:200px; background:#333; border-radius:12px; margin-bottom:16px;"></div>
                <div style="display:flex; align-items:center; gap:20px;">
                    <div class="channel-icon" style="width:80px; height:80px;"></div>
                    <h1>${channelId}</h1>
                </div>
                <div style="margin-top:20px; border-bottom:1px solid #333; display:flex; gap:24px; padding-bottom:10px;">
                    <strong>ВИДЕО</strong>
                    <span style="color:var(--text-secondary)">О КАНАЛЕ</span>
                </div>
            </div>
            <div class="video-grid">
                ${channelVideos.map(v => `
                    <div class="video-card" onclick="app.viewVideo('${v.id}')">
                        <div class="thumbnail"><img src="${v.thumbnail_url}"></div>
                        <div class="video-info">
                            <div class="details">
                                <h3>${v.title}</h3>
                                <p>${v.views} просмотров</p>
                            </div>
                        </div>
                    </div>
                `).join('')}
            </div>
        `;
        document.getElementById('app-content').innerHTML = html;
    },

    search() {
        const query = document.getElementById('search-input').value.toLowerCase();
        this.filteredVideos = this.allVideos.filter(v => 
            v.title.toLowerCase().includes(query) || 
            v.channel_id.toLowerCase().includes(query)
        );
        this.renderHome();
    },

    navigate(page) {
        if (page === 'home') {
            this.filteredVideos = [...this.allVideos];
            this.renderHome();
        }
    },

    toggleSettings() {
        const m = document.getElementById('settings-modal');
        const o = document.getElementById('overlay');
        const isVisible = m.style.display === 'block';
        m.style.display = isVisible ? 'none' : 'block';
        o.style.display = isVisible ? 'none' : 'block';
    },

    setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('plt_theme', theme);
    },

    setColor(color) {
        document.documentElement.setAttribute('data-color', color);
        localStorage.setItem('plt_color', color);
    },

    loadSettings() {
        const t = localStorage.getItem('plt_theme') || 'dark';
        const c = localStorage.getItem('plt_color') || 'red';
        this.setTheme(t);
        this.setColor(c);
    }
};

document.addEventListener('DOMContentLoaded', () => app.init());
</script>
</body>
</html>
