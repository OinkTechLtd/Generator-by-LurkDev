<!DOCTYPE html>
<html lang="ru" data-theme="dark" data-accent="red">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Платформа (by StreamLiveTV)</title>
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header class="header">
        <div class="logo" onclick="app.navigate('home')">Платформа</div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Введите запрос...">
            <button onclick="app.search()">🔍</button>
        </div>
        <div class="user-actions">
            <button onclick="app.navigate('settings')">⚙️</button>
        </div>
    </header>

    <main id="content">
        <!-- Сюда JS будет рендерить страницы -->
    </main>

    <nav class="mobile-nav">
        <div onclick="app.navigate('home')">🏠<span>Домой</span></div>
        <div onclick="app.navigate('search')">🔍<span>Поиск</span></div>
        <div onclick="app.navigate('subscriptions')">🔔<span>Подписки</span></div>
        <div onclick="app.navigate('library')">📚<span>Библиотека</span></div>
    </nav>


</body>
</html>


<script>
const API_URL = "https://aqeleulwobgamdffkfri.supabase.co/functions/v1/public-channels";
const WHITELIST_CHANNELS = ["oinktech", "twixoff", "ТВКАНАЛЫ"];

async function fetchData() {
    try {
        const response = await fetch(API_URL);
        const data = await response.json();
        
        // Фильтрация "мусора"
        return data.filter(item => {
            const channelName = item.channel_name?.toLowerCase();
            return WHITELIST_CHANNELS.some(allowed => channelName?.includes(allowed.toLowerCase()));
        });
    } catch (e) {
        console.error("API Error:", e);
        return [];
    }
}
</script>

<script>
const RecoEngine = {
    // Веса для алгоритма
    getWeights() {
        return JSON.parse(localStorage.getItem('user_weights')) || {};
    },

    saveView(videoId, channelName) {
        let weights = this.getWeights();
        weights[channelName] = (weights[channelName] || 0) + 1;
        localStorage.setItem('user_weights', JSON.stringify(weights));
        
        // Добавляем в историю
        let history = JSON.parse(localStorage.getItem('view_history')) || [];
        if(!history.includes(videoId)) history.push(videoId);
        localStorage.setItem('view_history', JSON.stringify(history));
    },

    sortVideos(videos) {
        const weights = this.getWeights();
        const history = JSON.parse(localStorage.getItem('view_history')) || [];

        return videos.sort((a, b) => {
            const weightA = weights[a.channel_name] || 0;
            const weightB = weights[b.channel_name] || 0;
            
            // Пенализация уже просмотренных
            const seenA = history.includes(a.id) ? -5 : 0;
            const seenB = history.includes(b.id) ? -5 : 0;

            return (weightB + seenB) - (weightA + seenA);
        });
    }
};
</script>

<script>
const app = {
    async renderHome() {
        const container = document.getElementById('content');
        let videos = await fetchData();
        videos = RecoEngine.sortVideos(videos);
        
        container.innerHTML = `<div class="video-grid">${videos.map(v => this.videoCard(v)).join('')}</div>`;
    },

    videoCard(v) {
        return `
            <div class="card" onclick="app.watch('${v.id}')">
                <img src="${v.thumbnail || 'placeholder.jpg'}" class="thumb">
                <div class="info">
                    <h3>${v.title}</h3>
                    <p>${v.channel_name}</p>
                </div>
            </div>
        `;
    },

    watch(videoId) {
        // Embed плеер согласно ТЗ
        const embedUrl = `https://embesslivestudio.lovable.app/?v=${videoId}`;
        const container = document.getElementById('content');
        
        container.innerHTML = `
            <div class="watch-page">
                <div class="player-container">
                    <iframe src="${embedUrl}" frameborder="0" allowfullscreen></iframe>
                </div>
                <div class="video-details">
                    <h1>Заголовок видео</h1>
                    <div class="channel-info">Канал: ...</div>
                </div>
                <div class="sidebar" id="nextVideos"></div>
            </div>
        `;
        location.hash = `watch?v=${videoId}`;
        // Логируем для алгоритма
        RecoEngine.saveView(videoId, 'channel_placeholder');
    }
};
</script>
