<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Смотрим | YouTube 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="player-container" id="player">
        <video id="main-video" src=""></video>
        
        <div class="controls">
            <div class="progress-area"><div class="progress-bar"></div></div>
            <div class="buttons">
                <button id="play-pause">Play</button>
                <div class="brand">СМОТРИМ 2026</div>
                <div class="time">00:00 / 00:00</div>
            </div>
        </div>

        <div class="url-hint">Управление: ?v=URL&t=SEC&vol=100&play=1</div>
    </div>
    <script src="script.js"></script>
</body>
</html>




<style>
body {
    background: #000;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Inter', sans-serif;
}

.player-container {
    position: relative;
    width: 90%;
    max-width: 1000px;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 0 50px rgba(255, 0, 0, 0.2);
    background: #111;
}

video { width: 100%; display: block; }

.controls {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 20px;
    background: linear-gradient(transparent, rgba(0,0,0,0.8));
    backdrop-filter: blur(10px);
    transition: opacity 0.3s;
}

.progress-area {
    height: 4px;
    background: rgba(255,255,255,0.2);
    cursor: pointer;
    border-radius: 2px;
    margin-bottom: 15px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #ff0000;
    position: relative;
}

.buttons {
    display: flex;
    align-items: center;
    gap: 20px;
    color: #fff;
}

.brand { font-weight: bold; letter-spacing: 2px; color: #ff0000; }

.url-hint {
    position: absolute;
    top: 10px;
    right: 10px;
    color: rgba(255,255,255,0.3);
    font-size: 10px;
}
</style>
 <script>
const video = document.getElementById('main-video');
const progressBar = document.querySelector('.progress-bar');
const playBtn = document.getElementById('play-pause');

// Функция парсинга URL
function applyUrlSettings() {
    const params = new URLSearchParams(window.location.search);
    
    // 1. Установка видео (v=ссылка)
    if (params.has('v')) {
        video.src = params.get('v');
    } else {
        // Тестовое видео, если URL пуст
        video.src = "http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4";
    }

    // 2. Время старта (t=секунды)
    if (params.has('t')) {
        video.currentTime = parseInt(params.get('t'));
    }

    // 3. Громкость (vol=0-100)
    if (params.has('vol')) {
        video.volume = parseInt(params.get('vol')) / 100;
    }

    // 4. Автоплей (play=1)
    if (params.get('play') === '1') {
        video.play().catch(e => console.log("Нужно взаимодействие пользователя для старта"));
    }
}

// Обновление прогресс-бара
video.ontimeupdate = () => {
    const percentage = (video.currentTime / video.duration) * 100;
    progressBar.style.width = percentage + "%";
};

// Переключение Play/Pause
playBtn.onclick = () => {
    video.paused ? video.play() : video.pause();
    playBtn.innerText = video.paused ? "Play" : "Pause";
};

// Инициализация при загрузке
window.onload = applyUrlSettings;
 </script>
